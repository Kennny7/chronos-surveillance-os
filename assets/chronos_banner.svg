<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="50%" stop-color="#0b1016" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff80" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#13201b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bannerBg)" rx="12"/>
  <rect width="1200" height="320" fill="url(#gridPattern)" rx="12"/>
  <rect width="1200" height="320" fill="none" stroke="#1f382b" stroke-width="2" rx="12"/>

  <!-- Tactical Header Bar -->
  <rect x="30" y="25" width="1140" height="32" fill="#0e171c" rx="4" stroke="#1f382b" stroke-width="1"/>
  <circle cx="50" cy="41" r="5" fill="#ff3344"/>
  <text x="65" y="46" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ff3344" letter-spacing="2">[LIVE SURVEILLANCE RADAR]</text>
  <text x="350" y="46" font-family="'Courier New', monospace" font-size="12" fill="#708599">SECTOR: METROPOLIS-07</text>
  <text x="620" y="46" font-family="'Courier New', monospace" font-size="12" fill="#708599">ENCRYPTION: QUANTUM-RESISTANT LOCAL</text>
  <text x="980" y="46" font-family="'Courier New', monospace" font-size="12" fill="#00ff80">STATUS: RECON ACTIVE</text>

  <!-- Emblem / Icon Section on Left -->
  <g transform="translate(60, 85)">
    <circle cx="75" cy="85" r="65" fill="#091215" stroke="#1f422e" stroke-width="2"/>
    <circle cx="75" cy="85" r="45" fill="none" stroke="#25583b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="75" cy="85" r="25" fill="none" stroke="#00ff80" stroke-width="1.5" opacity="0.6"/>
    <circle cx="75" cy="85" r="6" fill="#00ff80"/>
    <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#00ff80" stroke-width="2.5"/>
    <path d="M 125 45 L 125 25 L 105 25" fill="none" stroke="#00ff80" stroke-width="2.5"/>
    <path d="M 25 125 L 25 145 L 45 145" fill="none" stroke="#00ff80" stroke-width="2.5"/>
    <path d="M 125 125 L 125 145 L 105 145" fill="none" stroke="#00ff80" stroke-width="2.5"/>
    <line x1="10" y1="85" x2="140" y2="85" stroke="#00ff80" stroke-width="1" opacity="0.4"/>
    <line x1="75" y1="20" x2="75" y2="150" stroke="#00ff80" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Central Title & Core Mission Typography -->
  <text x="240" y="130" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="url(#neonGreen)" letter-spacing="4">CHRONOS SURVEILLANCE OS</text>
  <text x="242" y="165" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#e0e6ed" letter-spacing="2">NEXT-GEN AUTONOMOUS SMART CITY INTELLIGENCE &amp; THREAT RADAR</text>
  <text x="242" y="195" font-family="'Courier New', monospace" font-size="13" fill="#88a0b0">100% PURE OPEN-SOURCE  |  ZERO-CLOUD VENDOR LOCK-IN  |  DISTRIBUTED MICROSERVICES</text>

  <!-- Telemetry Badges at Bottom -->
  <g transform="translate(242, 225)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="34" rx="4" fill="#101920" stroke="#1f382b" stroke-width="1"/>
    <text x="12" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff80">INGEST: RTSP / USB / IP</text>
    <!-- Badge 2 -->
    <rect x="175" y="0" width="165" height="34" rx="4" fill="#101920" stroke="#1f382b" stroke-width="1"/>
    <text x="187" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00e5ff">ANOMALY: OPTICAL FLOW</text>
    <!-- Badge 3 -->
    <rect x="355" y="0" width="170" height="34" rx="4" fill="#101920" stroke="#1f382b" stroke-width="1"/>
    <text x="367" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff80">BIOMETRICS: 3D OBJ MESH</text>
    <!-- Badge 4 -->
    <rect x="540" y="0" width="180" height="34" rx="4" fill="#101920" stroke="#1f382b" stroke-width="1"/>
    <text x="552" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00e5ff">LLM: LOCAL GEMMA-4</text>
    <!-- Badge 5 -->
    <rect x="735" y="0" width="155" height="34" rx="4" fill="#101920" stroke="#1f382b" stroke-width="1"/>
    <text x="747" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff80">QUEUE: HITL CLEARANCE</text>
  </g>

  <!-- Right Decorative Telemetry Readout -->
  <g transform="translate(1040, 95)">
    <rect x="0" y="0" width="115" height="175" rx="6" fill="#090f14" stroke="#1f382b" stroke-width="1"/>
    <text x="15" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00ff80">FPS: 60.0</text>
    <text x="15" y="50" font-family="'Courier New', monospace" font-size="11" fill="#708599">NODES: 5/5</text>
    <text x="15" y="75" font-family="'Courier New', monospace" font-size="11" fill="#708599">BUS: R-PANDA</text>
    <text x="15" y="100" font-family="'Courier New', monospace" font-size="11" fill="#708599">VEC: QDRANT</text>
    <text x="15" y="125" font-family="'Courier New', monospace" font-size="11" fill="#708599">OBJ: MINIO</text>
    <line x1="12" y1="140" x2="103" y2="140" stroke="#1f382b" stroke-width="1"/>
    <text x="15" y="160" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00ff80">LATENCY: 4ms</text>
  </g>
</svg>
